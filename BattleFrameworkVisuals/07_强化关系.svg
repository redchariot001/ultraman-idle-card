<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" role="img" aria-labelledby="title desc">
<title id="title">07  成长模块如何汇入最终技能</title><desc id="desc">角色回响是个人饰品；变身器是队伍法术，两者归属与作用范围不同。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#8294a1"/></marker></defs>
<style>text{font-family:"Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif} .connector{fill:none;stroke:#8294a1;stroke-width:2;stroke-linejoin:round} </style>
<rect width="1240" height="900" fill="#ffffff"/>
<rect x="32" y="32" width="5" height="34" rx="2" fill="#167b65"/>
<text x="50" y="58" font-size="29" fill="#162b3b" font-weight="700" text-anchor="start">07  成长模块如何汇入最终技能</text>
<text x="50" y="91" font-size="17" fill="#526677" font-weight="400" text-anchor="start">角色回响是个人饰品；变身器是队伍法术，两者归属与作用范围不同。</text>
<g data-card="等级 + 品阶 + 职业装备" data-x="32" data-y="130" data-w="340" data-h="139">
<rect x="32" y="130" width="340" height="139" rx="12" fill="#eaf2ff" stroke="#285b9e" stroke-opacity="0.24"/>
<text x="50" y="164" font-size="23" fill="#285b9e" font-weight="700" text-anchor="start">等级 + 品阶 + 职业装备</text>
<text x="50" y="196" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">形成角色有效属性</text>
<text x="50" y="223" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">等级开放基础技能档位</text>
<text x="50" y="250" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">模式规则决定哪些成长生效</text>
</g>
<g data-card="角色原生技能" data-x="450" data-y="130" data-w="340" data-h="139">
<rect x="450" y="130" width="340" height="139" rx="12" fill="#fff4d9" stroke="#8c5b0c" stroke-opacity="0.24"/>
<text x="468" y="164" font-size="23" fill="#8c5b0c" font-weight="700" text-anchor="start">角色原生技能</text>
<text x="468" y="196" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">普攻 / 大招 / 技能 1 / 技能 2</text>
<text x="468" y="223" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">EXP 主动 + 专精被动</text>
<text x="468" y="250" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">先确定各条目的解锁与等级</text>
</g>
<g data-card="小队变身器" data-x="868" data-y="130" data-w="340" data-h="139">
<rect x="868" y="130" width="340" height="139" rx="12" fill="#e6f6f0" stroke="#167b65" stroke-opacity="0.24"/>
<text x="886" y="164" font-size="23" fill="#167b65" font-weight="700" text-anchor="start">小队变身器</text>
<text x="886" y="196" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">全队 BUFF 或独立触发机制</text>
<text x="886" y="223" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">受益对象由装配效果决定</text>
<text x="886" y="250" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">永久养成；独立于角色回响</text>
</g>
<g data-card="专武技能" data-x="32" data-y="330" data-w="340" data-h="139">
<rect x="32" y="330" width="340" height="139" rx="12" fill="#f0ebfc" stroke="#7654a2" stroke-opacity="0.24"/>
<text x="50" y="364" font-size="23" fill="#7654a2" font-weight="700" text-anchor="start">专武技能</text>
<text x="50" y="396" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">在指定强化档位生效</text>
<text x="50" y="423" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">强化已存在的技能或被动</text>
<text x="50" y="450" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">也可按角色追加专属机制</text>
</g>
<g data-card="觉醒技能" data-x="450" data-y="330" data-w="340" data-h="139">
<rect x="450" y="330" width="340" height="139" rx="12" fill="#f0ebfc" stroke="#7654a2" stroke-opacity="0.24"/>
<text x="468" y="364" font-size="23" fill="#7654a2" font-weight="700" text-anchor="start">觉醒技能</text>
<text x="468" y="396" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">巅峰+开放</text>
<text x="468" y="423" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">通常强化个人大招</text>
<text x="468" y="450" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">特殊角色可明确其他作用对象</text>
</g>
<g data-card="角色回响" data-x="868" data-y="330" data-w="340" data-h="139">
<rect x="868" y="330" width="340" height="139" rx="12" fill="#e6f6f0" stroke="#167b65" stroke-opacity="0.24"/>
<text x="886" y="364" font-size="23" fill="#167b65" font-weight="700" text-anchor="start">角色回响</text>
<text x="886" y="396" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">传说+开启获取资格</text>
<text x="886" y="423" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">装配已获得的专属回响</text>
<text x="886" y="450" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">定向强化指定技能或普攻</text>
</g>
<path d="M202 469 L202 514 L620 514" class="connector"/>
<path d="M620 469 L620 514 L620 514" class="connector"/>
<path d="M1038 469 L1038 514 L620 514" class="connector"/>
<path d="M620 514 L620 563" class="connector" marker-end="url(#arrow)"/>
<path d="M202 269 L202 299 L14 299 L14 632 L270 632" class="connector" marker-end="url(#arrow)"/>
<path d="M620 269 L620 302 L415 302 L415 514" class="connector"/>
<path d="M1038 269 L1038 299 L1226 299 L1226 632 L970 632" class="connector" marker-end="url(#arrow)"/>
<g data-card="生成本场有效技能与属性" data-x="270" data-y="563" data-w="700" data-h="139">
<rect x="270" y="563" width="700" height="139" rx="12" fill="#eaf2ff" stroke="#285b9e" stroke-opacity="0.24"/>
<text x="288" y="597" font-size="23" fill="#285b9e" font-weight="700" text-anchor="start">生成本场有效技能与属性</text>
<text x="288" y="629" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">数值叠加 ｜ 追加效果 ｜ 互斥替换按规则取舍</text>
<text x="288" y="656" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">再接受战斗中的 BUFF、状态与目标条件</text>
<text x="288" y="683" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">服务器演算与客户端还原读取相同结果</text>
</g>
<path d="M620 702 L620 748" class="connector" marker-end="url(#arrow)"/>
<g data-card="进入命中、伤害、控制、治疗、护盾等结算" data-x="270" data-y="748" data-w="700" data-h="87">
<rect x="270" y="748" width="700" height="87" rx="12" fill="#fff4d9" stroke="#8c5b0c" stroke-opacity="0.24"/>
<text x="288" y="782" font-size="24" fill="#8c5b0c" font-weight="700" text-anchor="start">进入命中、伤害、控制、治疗、护盾等结算</text>
</g>
<rect x="32" y="850" width="1176" height="47" rx="8" fill="#f0f3f5"/>
<text x="48" y="880" font-size="18" fill="#526677" font-weight="400" text-anchor="start">专武 / 觉醒 / 回响强化同一招式时，应声明叠加或替换关系，避免重复施加。</text>
</svg>