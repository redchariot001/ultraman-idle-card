<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="990" viewBox="0 0 1240 990" role="img" aria-labelledby="title desc">
<title id="title">04  解锁与升级路线</title><desc id="desc">等级、品阶和材料投入共同作用于技能；节点间距不代表培养时间。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#8294a1"/></marker></defs>
<style>text{font-family:"Microsoft YaHei UI","Microsoft YaHei","Noto Sans CJK SC",sans-serif} .connector{fill:none;stroke:#8294a1;stroke-width:2;stroke-linejoin:round} </style>
<rect width="1240" height="990" fill="#ffffff"/>
<rect x="32" y="32" width="5" height="34" rx="2" fill="#167b65"/>
<text x="50" y="58" font-size="29" fill="#162b3b" font-weight="700" text-anchor="start">04  解锁与升级路线</text>
<text x="50" y="91" font-size="17" fill="#526677" font-weight="400" text-anchor="start">等级、品阶和材料投入共同作用于技能；节点间距不代表培养时间。</text>
<text x="32" y="139" font-size="22" fill="#285b9e" font-weight="700" text-anchor="start">A · 等级轴（沿用建议）</text>
<text x="45" y="195" font-size="22" fill="#162b3b" font-weight="700" text-anchor="start">个人大招</text>
