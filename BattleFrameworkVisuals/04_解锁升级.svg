<text x="32" y="467" font-size="22" fill="#7654a2" font-weight="700" text-anchor="start">B · 品阶轴（关键机制节点）</text>
<g data-card="已获得角色" data-x="32" data-y="490" data-w="250" data-h="127">
<rect x="32" y="490" width="250" height="127" rx="12" fill="#f0f3f5" stroke="#526677" stroke-opacity="0.24"/>
<text x="50" y="524" font-size="25" fill="#526677" font-weight="700" text-anchor="start">已获得角色</text>
<text x="50" y="556" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">普攻与个人大招</text>
<text x="50" y="583" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">等级继续开放技能</text>
</g>
<g data-card="传说+" data-x="338" data-y="490" data-w="250" data-h="127">
<rect x="338" y="490" width="250" height="127" rx="12" fill="#fff4d9" stroke="#8c5b0c" stroke-opacity="0.24"/>
<text x="356" y="524" font-size="25" fill="#8c5b0c" font-weight="700" text-anchor="start">传说+</text>
<text x="356" y="556" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">解锁 EXP 主动 + 专精</text>
<text x="356" y="583" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">开启角色回响获取资格</text>
</g>
<g data-card="神话+*" data-x="644" data-y="490" data-w="250" data-h="127">
<rect x="644" y="490" width="250" height="127" rx="12" fill="#f0ebfc" stroke="#7654a2" stroke-opacity="0.24"/>
<text x="662" y="524" font-size="25" fill="#7654a2" font-weight="700" text-anchor="start">神话+*</text>
<text x="662" y="556" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">激活专武</text>
<text x="662" y="583" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">开放专武技能成长</text>
</g>
<g data-card="巅峰+" data-x="950" data-y="490" data-w="258" data-h="127">
<rect x="950" y="490" width="258" height="127" rx="12" fill="#f0ebfc" stroke="#7654a2" stroke-opacity="0.24"/>
<text x="968" y="524" font-size="25" fill="#7654a2" font-weight="700" text-anchor="start">巅峰+</text>
<text x="968" y="556" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">解锁觉醒技能</text>
<text x="968" y="583" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">继续衔接冠阶养成</text>
</g>
<path d="M282 553 L338 553" class="connector" marker-end="url(#arrow)"/>
<path d="M588 553 L644 553" class="connector" marker-end="url(#arrow)"/>
<path d="M894 553 L950 553" class="connector" marker-end="url(#arrow)"/>
<text x="32" y="678" font-size="22" fill="#167b65" font-weight="700" text-anchor="start">C · 材料轴（玩家决定投入优先级）</text>
<g data-card="蓝瓜子 → EXP 等级" data-x="32" data-y="704" data-w="350" data-h="146">
<rect x="32" y="704" width="350" height="146" rx="12" fill="#fff4d9" stroke="#8c5b0c" stroke-opacity="0.24"/>
<text x="50" y="738" font-size="23" fill="#8c5b0c" font-weight="700" text-anchor="start">蓝瓜子 → EXP 等级</text>
<text x="50" y="770" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">EXP 主动效果提升</text>
<text x="50" y="797" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">专精被动按对应档位成长</text>
<text x="50" y="824" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">不增加每人每局 1 次的默认上限</text>
</g>
<g data-card="专武材料 → 专武档位*" data-x="445" data-y="704" data-w="350" data-h="146">
<rect x="445" y="704" width="350" height="146" rx="12" fill="#f0ebfc" stroke="#7654a2" stroke-opacity="0.24"/>
<text x="463" y="738" font-size="23" fill="#7654a2" font-weight="700" text-anchor="start">专武材料 → 专武档位*</text>
<text x="463" y="770" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">+0 → +5 → +10 → +15</text>
<text x="463" y="797" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">分档解锁强化；+15 还要求巅峰</text>
<text x="463" y="824" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">不等同于每升 1 级就增加技能</text>
</g>
<g data-card="回响材料 → 装配回响" data-x="858" data-y="704" data-w="350" data-h="146">
<rect x="858" y="704" width="350" height="146" rx="12" fill="#e6f6f0" stroke="#167b65" stroke-opacity="0.24"/>
<text x="876" y="738" font-size="23" fill="#167b65" font-weight="700" text-anchor="start">回响材料 → 装配回响</text>
<text x="876" y="770" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">培养已获得的角色回响</text>
<text x="876" y="797" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">提升指定技能或普攻</text>
<text x="876" y="824" font-size="18" fill="#162b3b" font-weight="400" text-anchor="start">同一角色按持有选项更换方向</text>
</g>
<rect x="32" y="888" width="1176" height="47" rx="8" fill="#f0f3f5"/>
<text x="48" y="918" font-size="18" fill="#526677" font-weight="400" text-anchor="start">品阶图仅列关键节点，中间品阶仍保留；起始稀有度不等于当前养成品阶。</text>
<rect x="32" y="941" width="1176" height="47" rx="8" fill="#f0f3f5"/>
<text x="48" y="971" font-size="18" fill="#526677" font-weight="400" text-anchor="start">* 神话+专武及 +0 / +5 / +10 / +15 为沿用建议；EXP 总级数、消耗与回响档位另定。</text>
</svg>